services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codeanalyzer-app
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://codeanalyzer:codeanalyzer_pass@db:5432/codeanalyzer_db
      - SECRET_KEY=codeanalyzer-docker-secret-key-change-me
    depends_on:
      - redis
      - db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: codeanalyzer-redis
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: codeanalyzer-db
    environment:
      - POSTGRES_USER=codeanalyzer
      - POSTGRES_PASSWORD=codeanalyzer_pass
      - POSTGRES_DB=codeanalyzer_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
