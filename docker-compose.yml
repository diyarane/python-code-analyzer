services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codeanalyzer-app
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: codeanalyzer-redis
    restart: unless-stopped
